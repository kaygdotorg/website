<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480">
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#302435"/><stop offset="1" stop-color="#15121b"/></linearGradient>
    <linearGradient id="tile" x2="1" y2="1"><stop stop-color="#edb4d1"/><stop offset="1" stop-color="#b882ab"/></linearGradient>
  </defs>
  <rect width="640" height="480" fill="url(#bg)"/>
  <g transform="translate(208 128) rotate(-8 112 112)">
    <rect x="14" y="20" width="224" height="224" rx="52" fill="#000" opacity=".2"/>
    <rect width="224" height="224" rx="52" fill="url(#tile)"/>
    <g fill="none" stroke="#38263b" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
      <!-- Four rounded app tiles read as software/apps even at deck size. -->
      <rect x="50" y="50" width="48" height="48" rx="10"/>
      <rect x="126" y="50" width="48" height="48" rx="10"/>
      <rect x="50" y="126" width="48" height="48" rx="10"/>
      <rect x="126" y="126" width="48" height="48" rx="10"/>
    </g>
  </g>
</svg>
